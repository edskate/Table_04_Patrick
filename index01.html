<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Mensal de Ensaios – Patrick | Fevereiro 2026</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f1f1;
  padding:20px;
}

h2{text-align:center;}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}

th{
  background:#222;
  color:white;
}

.quarta{ background:#fff3c4; }
.quinta{ background:#e4d9ff; }
.sabado{ background:#d0e7ff; }
.domingo{ background:#ffd6d6; }

.trabalho{ font-weight:bold; }
.folga{ color:#777; }

@keyframes piscar {
  0%   { background:#ffe5e5; }
  50%  { background:#ff9b9b; }
  100% { background:#ffe5e5; }
}

.alerta-piscante{
  animation: piscar 1s infinite;
  border-left:6px solid #c40000;
}

#relatorio{
  margin-top:15px;
  padding:10px;
  background:#fff;
  border:2px solid #333;
}

.bloqueio{
  background:#000;
  color:#fff;
  padding:8px;
  text-align:center;
  margin-bottom:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="aviso"></div>

<h2>CONTROLE MENSAL – PATRICK • FEVEREIRO 2026</h2>

<table>
<thead>
<tr>
  <th>Dia</th>
  <th>Data</th>
  <th>Status</th>
  <th>Descrição do Ensaio</th>
  <th>Tempo (h)</th>
  <th>Patrick</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<div id="relatorio"></div>

<script>
// ================= CONFIG =================
const LIMITE_HORA = 20; // 🔒 BLOQUEIO ÀS 20:00
// ==========================================

const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

const ano = 2026;
const mes = 1; // Fevereiro

const diasTrabalhoFixos = ["Segunda","Terça","Sexta"];

const agora = new Date();
const hojeDia = agora.getDate();
const hojeMes = agora.getMonth();
const hojeAno = agora.getFullYear();
const horaAtual = agora.getHours();

const BLOQUEAR = horaAtual >= LIMITE_HORA;

const storageKey = `controle_patrick_2026_02_final`;

const dados = JSON.parse(localStorage.getItem(storageKey)) || {};
const tbody = document.getElementById("tabela");
const relatorio = document.getElementById("relatorio");
const aviso = document.getElementById("aviso");

// ===== AVISO DE BLOQUEIO =====
if(BLOQUEAR){
  aviso.innerHTML = `
    <div class="bloqueio">
      🔒 SISTEMA BLOQUEADO — EDIÇÃO ENCERRADA ÀS ${LIMITE_HORA}:00
    </div>
  `;
}

// ===== FUNÇÕES =====

function salvar(){
  if(BLOQUEAR){
    alert("🔒 Edição bloqueada após 20:00");
    return;
  }

  localStorage.setItem(storageKey, JSON.stringify(dados));
  atualizarRelatorio();
}

function atualizarRelatorio(){
  let trabalho = 0;
  let folga = 0;
  let horas = 0;

  Object.values(dados).forEach(d=>{
    if(d.status === "Trabalho") trabalho++;
    if(d.status === "Folga") folga++;
    horas += Number(d.tempo || 0);
  });

  relatorio.innerHTML = `
    <strong>📊 RELATÓRIO – FEVEREIRO 2026</strong><br>
    ✅ Dias de Trabalho: <b>${trabalho}</b><br>
    💤 Dias de Folga: <b>${folga}</b><br>
    ⏱️ Total de Horas de Ensaio: <b>${horas}</b>
    ${BLOQUEAR ? "<br><br>🔒 Sistema travado após 20:00" : ""}
  `;
}

// ===== MONTAGEM DA TABELA =====

const ultimoDia = new Date(ano, mes+1, 0).getDate();

for(let d=1; d<=ultimoDia; d++){
  const data = new Date(ano, mes, d);
  const nomeDia = dias[data.getDay()];

  if(!dados[d]) dados[d] = {};

  const statusPadrao =
    ["Quarta","Quinta","Sábado","Domingo"].includes(nomeDia)
    ? "Folga"
    : "Trabalho";

  dados[d].status ??= statusPadrao;
  dados[d].descricao ??= "";
  dados[d].tempo ??= "";
  dados[d].patrick ??= false;

  const tr = document.createElement("tr");

  if(nomeDia === "Quarta") tr.classList.add("quarta");
  if(nomeDia === "Quinta") tr.classList.add("quinta");
  if(nomeDia === "Sábado") tr.classList.add("sabado");
  if(nomeDia === "Domingo") tr.classList.add("domingo");

  if(
    d === hojeDia &&
    mes === hojeMes &&
    ano === hojeAno &&
    diasTrabalhoFixos.includes(nomeDia)
  ){
    tr.classList.add("alerta-piscante");
  }

  tr.innerHTML = `
    <td><strong>${nomeDia}</strong></td>
    <td>${String(d).padStart(2,"0")}/02/2026</td>

    <td>
      ${
        ["Quarta","Quinta","Sábado","Domingo"].includes(nomeDia)
        ? `<select ${BLOQUEAR ? "disabled" : ""}
            onchange="dados[${d}].status=this.value; salvar()">
            <option ${dados[d].status=="Folga"?"selected":""}>Folga</option>
            <option ${dados[d].status=="Trabalho"?"selected":""}>Trabalho</option>
          </select>`
        : `<span class="trabalho">TRABALHO</span>`
      }
    </td>

    <td>
      <input type="text"
        ${BLOQUEAR ? "disabled" : ""}
        value="${dados[d].descricao}"
        onchange="dados[${d}].descricao=this.value; salvar()">
    </td>

    <td>
      <input type="number" min="0" step="0.5"
        ${BLOQUEAR ? "disabled" : ""}
        value="${dados[d].tempo}"
        onchange="dados[${d}].tempo=this.value; salvar()">
    </td>

    <td>
      <input type="checkbox"
        ${BLOQUEAR ? "disabled" : ""}
        ${dados[d].patrick?"checked":""}
        onchange="dados[${d}].patrick=this.checked; salvar()">
    </td>
  `;

  tbody.appendChild(tr);
}

atualizarRelatorio();
</script>

</body>
</html>

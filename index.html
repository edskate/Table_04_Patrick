<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Mensal de Ensaios – Patrick</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f1f1;
  padding:20px;
}

h2{text-align:center;}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}

th{
  background:#222;
  color:white;
}

.quarta{ background:#fff3c4; }
.quinta{ background:#e4d9ff; }
.sabado{ background:#d0e7ff; }
.domingo{ background:#ffd6d6; }

.trabalho{ font-weight:bold; }
.folga{ color:#777; }

#relatorio{
  margin-top:15px;
  padding:10px;
  background:#fff;
  border:2px solid #333;
}

input[type="text"]{ width:100%; }
input[type="number"]{ width:70px; }
</style>
</head>

<body>

<h2 id="titulo"></h2>

<table>
<thead>
<tr>
  <th>Dia</th>
  <th>Data</th>
  <th>Status</th>
  <th>Descrição do Ensaio</th>
  <th>Tempo (h)</th>
  <th>Patrick</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<div id="relatorio"></div>

<script>
const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

// 👉 MÊS ANTERIOR
const hoje = new Date();
let mes = hoje.getMonth() - 1;
let ano = hoje.getFullYear();
if(mes < 0){ mes = 11; ano--; }

const storageKey = `controle_patrick_${ano}_${mes}`;

document.getElementById("titulo").innerText =
  `Controle Mensal – Patrick • ${new Date(ano, mes)
    .toLocaleString("pt-BR",{month:"long"}).toUpperCase()} ${ano}`;

const dados = JSON.parse(localStorage.getItem(storageKey)) || {};
const tbody = document.getElementById("tabela");
const relatorio = document.getElementById("relatorio");

function salvar(){
  localStorage.setItem(storageKey, JSON.stringify(dados));
  atualizarRelatorio();
}

function atualizarRelatorio(){
  let trabalho = 0;
  let folga = 0;
  let horas = 0;

  Object.values(dados).forEach(d=>{
    if(d.status === "Trabalho") trabalho++;
    if(d.status === "Folga") folga++;
    horas += Number(d.tempo || 0);
  });

  relatorio.innerHTML = `
    <strong>📊 RELATÓRIO DO MÊS – PATRICK</strong><br>
    ✅ Dias de Trabalho: <b>${trabalho}</b><br>
    💤 Dias de Folga: <b>${folga}</b><br>
    ⏱️ Total de Horas de Ensaio: <b>${horas}</b>
  `;
}

const ultimoDia = new Date(ano, mes+1, 0).getDate();

for(let d=1; d<=ultimoDia; d++){
  const data = new Date(ano, mes, d);
  const nomeDia = dias[data.getDay()];

  if(!dados[d]) dados[d] = {};

  const statusPadrao =
    ["Quarta","Quinta","Sábado","Domingo"].includes(nomeDia)
    ? "Folga"
    : "Trabalho";

  dados[d].status ??= statusPadrao;
  dados[d].descricao ??= "";
  dados[d].tempo ??= "";
  dados[d].patrick ??= false;

  const tr = document.createElement("tr");

  if(nomeDia === "Quarta") tr.classList.add("quarta");
  if(nomeDia === "Quinta") tr.classList.add("quinta");
  if(nomeDia === "Sábado") tr.classList.add("sabado");
  if(nomeDia === "Domingo") tr.classList.add("domingo");

  tr.innerHTML = `
    <td>${nomeDia}</td>
    <td>${String(d).padStart(2,"0")}/${String(mes+1).padStart(2,"0")}/${ano}</td>
    <td>
      ${
        ["Quarta","Quinta","Sábado","Domingo"].includes(nomeDia)
        ? `<select onchange="dados[${d}].status=this.value; salvar()">
            <option ${dados[d].status=="Folga"?"selected":""}>Folga</option>
            <option ${dados[d].status=="Trabalho"?"selected":""}>Trabalho</option>
          </select>`
        : `<span class="trabalho">Trabalho</span>`
      }
    </td>
    <td>
      <input type="text"
        value="${dados[d].descricao}"
        onchange="dados[${d}].descricao=this.value; salvar()">
    </td>
    <td>
      <input type="number" min="0" step="0.5"
        value="${dados[d].tempo}"
        onchange="dados[${d}].tempo=this.value; salvar()">
    </td>
    <td>
      <input type="checkbox"
        ${dados[d].patrick?"checked":""}
        onchange="dados[${d}].patrick=this.checked; salvar()">
    </td>
  `;

  tbody.appendChild(tr);
}

salvar();
</script>

</body>
</html>
